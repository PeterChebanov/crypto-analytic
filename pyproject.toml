[project]
name = "crypto-intel"
version = "0.1.0"
description = "AI Crypto Intelligence Platform — research + decision support"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.4.1",
    "langchain-xai>=1.3.0",
    "langgraph>=1.2.10",
    "langsmith>=0.10.10",
    "psycopg>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_intel"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "fakeredis>=2.37.0",
    "pytest>=9.1.1",
]
